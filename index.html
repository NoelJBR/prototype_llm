<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Nmap Agent</title>
</head>
<body>
    <header>
        <h1>Nmap Network Scanner</h1>
    </header>
    <main>
        <section class="scan">
            <h2>Perform Scan</h2>
            <form id="scan-form">
                <input type="text" id="target" placeholder="Target IP or hostname" required>
                <input type="text" id="options" placeholder="Nmap options (e.g., -sV -p 80)">
                <button type="submit">Scan</button>
            </form>
            <div id="scan-result"></div>
        </section>
        <section class="chat">
            <h2>AI Assistant</h2>
            <div id="chat-window">
                <div id="chat-output"></div>
                <input type="text" id="chat-input" placeholder="Ask about nmap or scan results...">
                <button id="send-btn">Send</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
